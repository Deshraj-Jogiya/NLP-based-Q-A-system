name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Run the real pipeline end-to-end (embeddings + NER + similarity setup)
        run: |
          python -c "import main"
          python -c "import alternate_approch"
      - name: Run the data-quality profiling script
        run: python data_insights.py
      - name: Install pytest and run the LlamaIndex semantic search tests
        run: |
          pip install pytest
          pytest test_llamaindex_search.py -v
      - name: Run the Semantic Kernel plugin orchestration tests
        run: pytest test_semantic_kernel_plugin.py -v
      - name: Run the LangChain RAG chain tests (real local-model generation, not mocked)
        run: pytest test_rag_chain.py -v
