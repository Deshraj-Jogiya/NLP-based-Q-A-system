name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Run the real pipeline end-to-end (embeddings + NER + similarity setup)
        run: |
          python -c "import main"
          python -c "import alternate_approch"
      - name: Run the data-quality profiling script
        run: python data_insights.py
